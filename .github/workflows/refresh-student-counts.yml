name: Refresh student counts

on:
  push:
    branches: [main]
    paths:
      - "data/university-targets.csv"
      - "data/highschool-targets.csv"
      - "scripts/refresh_student_counts.py"
      - ".github/workflows/refresh-student-counts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download MOE data and calculate counts
        run: python scripts/refresh_student_counts.py
      - name: Show validation summary
        run: |
          cat data/generated/validation-report.md
      - name: Commit generated results
        run: |
          git config user.name "studentman-bot"
          git config user.email "studentman-bot@users.noreply.github.com"
          git add data/generated/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "data: refresh 114 student counts from MOE"
            git push
          fi
